name: one_second_diary
description: Record one second of your day, everyday.

publish_to: "none"

version: 2.0.0+22

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  camera: ^0.12.0+1
  device_info_plus: ^13.1.0
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  ffmpeg_kit_flutter_new: ^4.6.2
  flutter:
    sdk: flutter
  flutter_android_volume_keydown: ^1.0.0
  flutter_archive: ^6.0.4
  flutter_bloc: ^9.1.1
  flutter_email_sender: ^8.0.0
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get_it: ^9.3.0
  go_router: ^18.0.2
  image_picker: ^1.0.4
  intl: ^0.20.3
  jovial_svg: ^1.1.29
  native_device_orientation: ^2.1.1
  package_info_plus: ^10.1.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.1
  share_plus: ^13.1.0
  shared_preferences: ^2.4.1
  timezone: ^0.11.0
  get_thumbnail_video: ^0.7.3
  url_launcher: ^6.2.1
  wakelock_plus: ^1.6.1
  media_store_plus:
    git:
      url: https://github.com/KyleKun/media_store_plus.git
      ref: fa75179bf94e1ce4ba5ca538ea8bba1ac2c4ae35
  # Hacked fork or repo until https://github.com/flutter/flutter/issues/170737 fixed
  video_player:
    git:
      url: https://github.com/KyleKun/packages/
      ref: 336bd07f53efc026a4aad2c3cb7294937c6384d9
      path: packages/video_player/video_player
  wechat_assets_picker:
    git:
      url: https://github.com/KyleKun/flutter_wechat_assets_picker/
      ref: 330836c83f9f96efab46d3567400b1cfd3db6256
  dual_cameras: ^0.1.2
  file_picker: ^13.1.0

dev_dependencies:
  bloc_test: ^10.0.0
  crypto: ^3.0.7
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # iOS builds through CocoaPods everywhere (CI, contributors, App Store
  # archives): permission_handler takes its PERMISSION_* macros from the
  # Podfile, and under Swift Package Manager it compiles every permission
  # out. docs/ios.md, "CocoaPods only".
  config:
    enable-swift-package-manager: false

  assets:
    # Decode samples of the phone check (engine_device_media_check_runner.dart).
    - assets/calibration/
    - assets/flags/
    - assets/fonts/
    - assets/images/
    # Licence texts Flutter does not collect from pub (bundled_licenses.dart).
    - assets/licenses/
    - assets/translations/
    - CHANGELOG.md
    - CONTRIBUTORS.md

  shaders:
    - shaders/earth.frag

  fonts:
    - family: Magic
      fonts:
        - asset: assets/fonts/YuseiMagic-Regular.ttf
    # UI font: static instances of Rubik (tool/fonts/README.md).
    # License: assets/fonts/Rubik-OFL.txt
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
    # Icons: Material Symbols Rounded, subset to lib/theme/osd_icons.dart
    # (tool/icons/README.md). License: assets/fonts/MaterialSymbols-LICENSE.txt
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded-Subset.ttf
    # Noto Sans SC Medium, for the date and place stamps Rubik can't draw
    # (StampFontPolicy, OsdFonts.notoSansSc).
    # License: assets/fonts/NotoSansSC-OFL.txt
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
