name: Compile iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build Flutter iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode >= 26.2
        run: |
          LATEST_XCODE=$(ruby -e "
            versions = Dir.glob('/Applications/Xcode_*.app').map { |p| p.match(/Xcode_(.*)\.app/)[1] rescue nil }.compact
            valid_versions = versions.select { |v| (Gem::Version.new(v.split('_').first) >= Gem::Version.new('26.2')) rescue false }
            puts valid_versions.sort_by { |v| Gem::Version.new(v.split('_').first) rescue Gem::Version.new('0') }.last
          ")
          if [ -z "$LATEST_XCODE" ]; then
            echo "Failed to find Xcode >= 26.2"
            exit 1
          fi
          echo "Selecting Xcode $LATEST_XCODE"
          sudo xcode-select -s "/Applications/Xcode_${LATEST_XCODE}.app/Contents/Developer"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies (fail if pubspec.lock is out of date)
        run: flutter pub get --enforce-lockfile

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Compile iOS Binary
        run: flutter build ios --release --no-codesign
